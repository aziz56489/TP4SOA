spring.application.name=tp4camunda
spring.datasource.url=jdbc:h2:file:./camunda-h2-database
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo
camunda.bpm.admin-user.first-name=Demo
camunda.bpm.admin-user.last-name=User

camunda.bpm.generic-properties.properties.enforceHistoryTimeToLive=false
camunda.bpm.deployment-resource-pattern=classpath*:/BPMN/DiagramEmploye.bpmn
camunda.bpm.auto-deployment-enabled=true
camunda.bpm.filter.create=All tasks
employee.api.url=http://localhost:8080/api/employees
advice.api.url=https://api.adviceslip.com/advice
server.port=8080
